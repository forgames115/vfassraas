name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: brew install ldid make xz

      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL \
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" \
            -o "$HOME/theos/sdks/sdk.tar.xz"
          tar -xJf "$HOME/theos/sdks/sdk.tar.xz" -C "$HOME/theos/sdks"
          rm "$HOME/theos/sdks/sdk.tar.xz"

      - name: Build deb
        run: gmake package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Find deb
        id: deb
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "path=$DEB"             >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadooCapitalAI-deb
          path: ${{ steps.deb.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deb.outputs.path }}
          name: ${{ github.ref_name }}
          body: |
            ## BadooCapitalAI ${{ github.ref_name }}
            ```bash
            dpkg -i BadooCapitalAI_*.deb && uicache -a
            ```
            Settings → BadooCapitalAI → paste license key → enable toggle.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
